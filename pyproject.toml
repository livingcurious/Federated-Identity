[project]
name = "identity-fabric"
version = "0.1.0"
description = "A minimal, security-serious OIDC Single Sign-On trust fabric (IdP + two SPs)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "joserfc>=1.0",
    "cryptography>=43.0",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["mypy>=1.13", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fabric.idp" = ["templates/*.html", "static/*.css"]
"fabric.sp" = ["templates/*.html", "static/*.css"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep ruff's defaults (E4/E7/E9/F) and add E402 so the deliberate post-sys.path
# imports in run.py / scripts carry a meaningful `noqa`.
extend-select = ["E402"]
