<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Identity Fabric</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="card">
    <div class="brand"><span class="dot"></span><h1>Identity Fabric</h1></div>
    <p class="sub">Sign in to continue to <strong>{{ client_name }}</strong></p>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <form method="post" action="/login" autocomplete="off">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autofocus
             value="{{ email or '' }}" placeholder="you@example.com" />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required placeholder="••••••••" />

      {% for key, value in params.items() %}
      <input type="hidden" name="{{ key }}" value="{{ value }}" />
      {% endfor %}

      <button type="submit">Sign in</button>
    </form>

    <div class="hint">
      Demo identities — e.g. <code>ada@example.com</code> / <code>correct horse battery</code>.
      One sign-in here authenticates every connected app.
    </div>
  </main>
</body>
</html>
